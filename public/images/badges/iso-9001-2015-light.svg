<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="isoTitleLight isoDescLight">
  <title id="isoTitleLight">ISO 9001:2015 Certified</title>
  <desc id="isoDescLight">Quality management system certified to ISO 9001:2015</desc>
  <circle cx="120" cy="120" r="118" fill="#f7f6f3"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="#7a1f2b" stroke-width="3"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#7a1f2b" stroke-width="1.25"/>
  <path id="topArcL" d="M40,120 a80,80 0 1,1 160,0" fill="none"/>
  <path id="botArcL" d="M200,120 a80,80 0 1,1 -160,0" fill="none"/>
  <text fill="#7a1f2b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.28em">
    <textPath href="#topArcL" startOffset="50%" text-anchor="middle">QUALITY MANAGEMENT</textPath>
  </text>
  <text fill="#7a1f2b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.28em">
    <textPath href="#botArcL" startOffset="50%" text-anchor="middle">SYSTEM CERTIFIED</textPath>
  </text>
  <text x="120" y="98" text-anchor="middle" fill="#1a1f26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.12em">ISO</text>
  <text x="120" y="128" text-anchor="middle" fill="#7a1f2b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="0.04em">9001</text>
  <line x1="78" y1="142" x2="162" y2="142" stroke="#7a1f2b" stroke-width="1.5"/>
  <text x="120" y="162" text-anchor="middle" fill="#1a1f26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.18em">2015</text>
</svg>
